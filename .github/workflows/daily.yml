name: Daily Pipeline

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST (UTC+5:30 → 00:30 UTC)
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

# Never run two pipelines at once (a manual run during the scheduled one
# would race on the git push of data/jobs.db).
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        # Fail before touching data if the code is broken on this Python.
        run: python -m pytest -q

      - name: Create data directories
        run: mkdir -p data data/cache

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}  # optional repo variable; defaults in config.py
        run: python run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db data/jobs.csv data/pipeline_summary.json
          git diff --staged --quiet || git commit -m "chore: daily pipeline run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
